[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "reel-scout"
dynamic = ["version"]
description = "Short-form video analysis tool — crawl, transcribe, and visually analyze YouTube Shorts, Instagram Reels, and TikTok"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Hevin Yeh (vulture.s)" }]
keywords = ["video", "analysis", "shorts", "reels", "tiktok", "whisper", "vlm"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "yt-dlp>=2024.1.0",
    # urllib HTTPS on python.org macOS builds has no CA store until
    # "Install Certificates.command" runs; see reel_scout/utils/https.py
    "certifi>=2023.7.22",
]

[project.urls]
# Homepage 指官網不指 repo：PyPI 頁面上那個連結是多數人第一次看到這個專案的地方，
# 而一份 README 回答不了「它跟丟連結給 AI 有什麼不同」。
Homepage = "https://vulture-s.github.io/reel-scout/"
Repository = "https://github.com/vulture-s/reel-scout"
Issues = "https://github.com/vulture-s/reel-scout/issues"
Changelog = "https://github.com/vulture-s/reel-scout/blob/master/CHANGELOG.md"

[project.optional-dependencies]
whisper = ["faster-whisper>=1.1.0", "whisper-guard>=0.3.3"]
# Metal transcription on Apple Silicon (WHISPER_BACKEND=mlx, issue #113).
# faster-whisper is CPU-only on macOS: on an M2 Max large-v3 runs at RTF 1.22
# there vs 0.04 for mlx large-v3-turbo. The default WHISPER_BACKEND=auto uses it
# when installed; elsewhere the marker makes this extra install nothing and auto
# picks faster-whisper -- so pair it with [whisper].
#
# scipy pin (macOS 27, Python 3.10): mlx-whisper imports scipy.signal, and every
# scipy 1.15.x wheel for cp310 fails to load there -- dyld rejects
# `_spropack.cpython-310-darwin.so` ("section '__DATA/__thread_bss' has a
# zero-fill section type, but offset field is not zero"), so the mlx backend
# dies at import. Measured 2026-10-19 on an M2 Max, clean venv per version:
# 1.13.1 ok, 1.14.1 ok, 1.15.0 / 1.15.2 / 1.15.3 fail. Scoped to cp310 because
# that is all that was measured; >=3.11 resolves to 1.16+ (untested).
mlx = [
    "mlx-whisper>=0.4.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "scipy<1.15; sys_platform == 'darwin' and platform_machine == 'arm64' and python_version < '3.11'",
    "whisper-guard>=0.3.3",
]
audio = ["onnxruntime>=1.15.0", "numpy>=1.21.0"]
vector = ["lancedb>=0.4.0", "chromadb>=0.4.0"]
# R-mig: diarization now lives in the speaker-align package; its [pyannote]
# extra pulls pyannote.audio (which brings torch). speaker-align is not yet on
# PyPI — install it editable on M2 (`pip install -e speaker-align[pyannote]`).
diarize = ["speaker-align[pyannote]"]
instagram = ["instaloader>=4.10"]
# Simplified -> Traditional (OpenCC s2twp / s2tw) at the source: the analysis
# copy `inspire` feeds the LLM, and transcripts / subtitles as they are saved
# (the received text is kept in transcripts.*_original). Never a rewrite of the
# model's output. Pure python, no compiled parts. Without it both warn on
# stderr and keep the text unconverted.
zh = ["opencc-python-reimplemented>=0.1.7"]
ocr = ["pytesseract>=0.3.10", "Pillow>=9.0"]
# Camera movement (§6C) reads H.264 motion vectors, which only the decoder can
# hand over -- ffprobe reports that the side data exists but never its values.
# PyAV is already present for anyone on [whisper] (faster-whisper depends on
# it), so this extra costs those installs nothing.
motion = ["av>=12", "numpy>=1.21.0"]
# numpy is the audio detector's own dependency, not a test helper: `analyze()`
# cannot run without it. Until `tests/test_audio_sfx_floor.py` the suite only
# reached the pure-python halves of that module, so CI never needed it — and a
# test that skips itself on CI is not a gate, it is decoration. onnxruntime
# stays out: those tests script the session rather than load the 327 MB model.
dev = ["pytest>=7.0", "whisper-guard>=0.3.3", "numpy>=1.21.0"]

[project.scripts]
reel-scout = "reel_scout.cli:main"
reel-scout-mcp = "reel_scout.mcp.server:main"

[tool.hatch.version]
path = "reel_scout/__init__.py"

# The skill is half the product and none of it used to ship. `pip install
# reel-scout` gave you the CLI and nothing an agent could load — no SKILL.md, no
# /scout command, no prompt pack, no setup preflight — so the documented flow was
# reachable only by cloning. Vendor those assets into the wheel under
# reel_scout/skill/ and `reel-scout skill install` lays them down where Claude
# looks. Paths here are repo-root-relative sources → in-wheel destinations.
[tool.hatch.build.targets.wheel]
packages = ["reel_scout"]

[tool.hatch.build.targets.wheel.force-include]
"SKILL.md" = "reel_scout/skill/SKILL.md"
"commands" = "reel_scout/skill/commands"
"prompts" = "reel_scout/skill/prompts"
"scripts/setup.py" = "reel_scout/skill/scripts/setup.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--tb=short -q"
