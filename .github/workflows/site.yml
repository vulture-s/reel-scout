# 建構並部署 site/ 的官網到 GitHub Pages。
#
# 文件頁是直接讀 `docs/*.md` 與 `CHANGELOG.md` 渲染的，所以那些檔一改，網站就要重建
# —— paths 把它們也列進來的理由在此，不是為了保險。
#
# 跟 arkiv 的同名 workflow 有一處刻意不同：**那支的 deploy 還卡在手動 dispatch**，
# 因為它有一個舊的 Jekyll 站還在 main:/docs 服務中，自動部署會在 cutover 前就搶走。
# reel-scout 沒有舊站 ⇒ 一開始就自動部署。
#
# 🔴 第一次使用前要手動做一次：Settings → Pages → Source 切成 "GitHub Actions"。
#    沒切的話 deploy job 會失敗（而不是靜默不生效）—— 那是對的方向，
#    但要知道第一次紅是這個原因，不是 workflow 寫錯。
name: site

on:
  pull_request:
    paths: ["site/**", "docs/**", "CHANGELOG.md", ".github/workflows/site.yml"]
  push:
    branches: [master]
    paths: ["site/**", "docs/**", "CHANGELOG.md", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx astro build

      # 每一頁都要真的產出來。Astro 的 getStaticPaths 失敗時會少產幾頁而不是整個失敗，
      # 而少掉的那幾頁在部署後就是 404 —— 沒有人會在建構日誌裡數頁數。
      - name: 每一個路由都存在
        run: |
          for f in index.html how-it-works.html demo.html limits.html \
                   install.html docs.html changelog.html \
                   commands.html roadmap.html; do
            test -f "dist/$f" || { echo "missing dist/$f"; exit 1; }
          done
          # 「實際畫面」整頁的內容就是這九張 —— 少一張，那一節只剩標題與說明，
          # 而頁面照樣建得出來。數量寫死是刻意的：加截圖時會紅，提醒你一起改這裡。
          n=$(ls dist/img/inspector/*.webp 2>/dev/null | wc -l | tr -d ' ')
          [ "$n" = "9" ] || { echo "expected 9 inspector screenshots, found $n"; exit 1; }

      # 紙質是這一版官網的主要視覺決定，而它整個活在一個 CSS 檔裡。
      # 那個檔被 tree-shake 掉或改名，頁面仍然會建得出來、只是變成一張白紙 ——
      # 建構成功與視覺消失在日誌上完全同形。
      - name: 紙質層有進到產出
        run: |
          grep -rq "feTurbulence" dist/ || { echo "paper fibre missing from build"; exit 1; }
          grep -rq "repeating-linear-gradient" dist/ || { echo "ruled lines missing from build"; exit 1; }
          # 裝訂邊線跟紙張邊界 —— 兩個都只活在 CSS 裡，掉了頁面照建、只是回到「平」的樣子。
          grep -rq -- "--margin-rule" dist/ || { echo "margin rule missing from build"; exit 1; }
          grep -rq -- "--desk" dist/ || { echo "desk/sheet tokens missing from build"; exit 1; }

      # 刊頭的版號是從 reel_scout/__init__.py 讀的。讀不到時建構會 throw，
      # 但「讀到空字串」不會 —— 那會在頁面上長成 "v · MIT"，而 CI 看起來一樣綠。
      - name: 刊頭有渲染出真的版號
        run: |
          for f in dist/*.html; do
            grep -qE 'v[0-9]+\.[0-9]+\.[0-9]+ · MIT' "$f" || { echo "no version in masthead: $f"; exit 1; }
          done

      # GA4 不在，網站照樣好好的 —— 只是量不到任何東西，而且要好幾週後才會有人發現。
      - name: 中文斷句的兩條規則有進到產出
        run: |
          # 量的是 **壓過之後的 CSS**：Astro 會把註解整個拿掉，所以這裡 grep 到的
          # 一定是真的規則，不會像讀 .astro 原始碼那次被註解餵飽。
          css=$(ls dist/_astro/*.css | head -1)
          grep -q "text-wrap:pretty" "$css" || {
            echo "orphan-line avoidance (text-wrap:pretty) missing"; exit 1; }
          # 這兩塊沒有行長上限時會跟著紙張一起拉寬（#163 就把它們推到 80 字/行）。
          # 比對整條規則而不只是 62ch —— 屬性順序每次壓縮都可能不同，但一定在同一塊裡。
          for sel in "footer p" "\.sub p"; do
            grep -qE "$sel\{[^}]*max-width:62ch" "$css" || {
              echo "measure cap missing on: $sel"; exit 1; }
          done

      - name: 首頁有提到每一個抓得到的平台
        run: |
          # 🔴 量的是**渲染後**的 dist/index.html，不是 index.astro。
          #    那支 .astro 裡有兩個定義了但從沒被 .map() 出來的 const
          #    （diffs / layers），讀原始碼的檢查會被那些死文案餵飽 ——
          #    實測：原始碼有 2 次 Threads，渲染後只有 1 次。
          # ⚠️ 這份清單由 tests/test_site_claims.py 比對 crawl._CRAWLERS，
          #    平台加了而這裡沒加會在 pytest 那邊紅，所以不會默默漂掉。
          # 剝掉標籤再比 —— 不然 meta description 跟 href 裡的字也算數，
          #    而那兩個地方寫了平台名，來訪者在頁面上還是看不到。
          sed 's/<[^>]*>/ /g' dist/index.html > /tmp/front.txt
          for p in youtube instagram tiktok threads; do
            grep -qi "$p" /tmp/front.txt || {
              echo "front page body never names a supported platform: $p"; exit 1; }
          done

      - name: 加權面板有把「總和 100%」印在畫面上
        run: |
          # 🔴 守的是 Hevin 指名的那件事：面板底下要看到權重總和、而且看到它
          #    會被縮放成 100%。
          # ⚠️ 不要用 grep「權重總和 100%」這類**字串**來守 —— 那些字同時出現在
          #    註解與 sumText 變數裡，把顯示整段拔掉照樣 grep 得到（第一版就是
          #    這樣寫，四項裡有兩項是空的，負向測試才抓到）。
          #    釘的是「組起來並寫進那一行」那條接縫，三道都做過負向測試。
          grep -rq "sumText + ' · 總分 '" dist/ || { echo "sum+score not assembled into the footer line"; exit 1; }
          grep -rq "權重總和 0% · 算不出總分" dist/ || { echo "missing all-zero readout"; exit 1; }
          # 原始總和要從滑桿夾負值後累加，不是拿歸一化後的值（那樣永遠印 100%）
          grep -rqF "raw += Math.max(0, w[k])" dist/ || { echo "raw slider sum not computed"; exit 1; }

      - name: GA4 標籤有進到每一頁
        run: |
          for f in dist/*.html; do
            grep -q "GT-WB2F3LB8" "$f" || { echo "no GA4 tag in $f"; exit 1; }
          done

      # 🔴 這兩道是官網上線第一天的實測缺陷補的，兩個都在「建構成功、CI 全綠」下存在。
      #
      # ① 文件頁有兩個 h1（版面一個、md 自帶一個）。只有開頁面才看得見。
      # ② `../prompts/…md` 原樣輸出 ⇒ 線上 404。改寫器只認同層的 .md，
      #    其餘「原樣留著」—— 而原樣留著不是中立，是保證 404。
      - name: 每頁只有一個 h1，且沒有 .md 連結殘留
        run: |
          fail=0
          for f in dist/*.html; do
            n=$(grep -o "<h1" "$f" | wc -l | tr -d ' ')
            [ "$n" = "1" ] || { echo "$f has $n <h1>"; fail=1; }
          done
          # 站內相對的 .md 連結一定是壞的（這個站只出 .html）。
          # 指向 github.com 的 .md 是刻意的落點，所以只抓非 http 的那些。
          if grep -roE 'href="(\.{0,2}/)?[^":]*\.md[^"]*"' dist/ | grep -v 'github\.com' | head -5 | grep .; then
            echo "unresolved .md links above"; fail=1
          fi
          exit $fail

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
